# ALSA configuration — routes default playback to the 3.5mm headphone jack.
#
# We use `hw:Headphones` (by-name) instead of `hw:1,0` so the routing stays
# valid even when the HDMI card-index shifts (Pi 4 has two HDMI ports that
# may hot-(un)plug). The card name "Headphones" is set by the bcm2835 driver.
#
# `type plug` lets ALSA convert sample rate / format on the fly so Chromium
# (which may pick 48 kHz) plays cleanly on the 44.1 kHz hardware.
#
# List cards: `aplay -l`. Inspect names: `cat /proc/asound/cards`.

pcm.!default {
    type plug
    slave.pcm "hw:Headphones,0"
}

ctl.!default {
    type hw
    card "Headphones"
}
